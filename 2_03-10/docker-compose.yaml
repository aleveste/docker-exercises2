services:
  backend:
    build:
      context: ../example-app/backend
      dockerfile: Dockerfile.backend
    container_name: backend
    ports:
      - 8080:8080

  frontend:
    build:
      context: ../example-app/frontend
      dockerfile: Dockerfile.frontend
    container_name: frontend
    ports:
      - 5001:5001
    depends_on:
      - backend